# 로컬 볼륨/부하 테스트 전용 설정 (실제 비밀값 없음, 로컬 전용 더미 값)
# 실행: --spring.profiles.active=volume --spring.config.additional-location=file:performance/volume/local/
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3307/bookii_volume?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&rewriteBatchedStatements=true
    username: bookii
    password: ${VOLUME_DB_PASSWORD:volume-local}   # E:/mysql-volume 전용 인스턴스(로컬 전용 계정)
    hikari:
      maximum-pool-size: 10   # DEV와 동일(기본값)
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379
      prefix: "volume:"

logging:
  level:
    org.hibernate.SQL: warn
    org.hibernate.type.descriptor.sql: warn

jwt:
  token:
    secret-key: volume-test-only-secret-key-not-used-anywhere-else-0123456789
    expiration:
      access: 604800000    # 7일 (측정 중 토큰 만료 방지)
      refresh: 1209600000

oauth:
  google:
    client-id: dummy
  kakao:
    client-id: dummy
    redirect-uri: http://localhost/dummy
  apple:
    bundle-id: dummy
    team-id: dummy
    key-id: dummy
    private-key: dummy   # 로그인 시에만 파싱되므로 기동에는 영향 없음

aladin:
  ttbkey: dummy

aws:
  s3:
    bucket-name: dummy-bucket
    region: ap-northeast-2

swagger:
  auth:
    username: dummy
    password: dummy

discord:
  webhook:
    enabled: false
    url: ""

push:
  firebase:
    enabled: false

scheduler:
  bestseller:
    cron: "-"
  delivery-receive-reminder:
    cron: "-"
  direct-exchange-reminder:
    cron: "-"

server:
  port: 18080

management:
  server:
    port: 19091
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

global:
  scrape_interval: 5s
  evaluation_interval: 10s

scrape_configs:
  # job 이름을 DEV와 같게 두어 기존 Grafana 대시보드(bookii-dev.json)를 그대로 사용
  - job_name: bookii-dev
    metrics_path: /actuator/prometheus
    # 로컬 앱은 v1 프로필이 아니라 actuator가 인증을 요구함 → mint-token.py로 만든 로컬 토큰 사용
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/prometheus.token
    static_configs:
      - targets: ["host.docker.internal:19091"]
  - job_name: mysql
    static_configs:
      - targets: ["mysqld-exporter:9104"]

spring:
  application:
    name: bookiibookii

springdoc:
  swagger-ui:
    doc-expansion: none
    tags-sorter: none

# Opt in only from profiles that run Prometheus; this keeps the registry inactive in PROD.
management:
  prometheus:
    metrics:
      export:
        enabled: false

scheduler:
  bestseller:
    cron: "0 0 0 * * *"
